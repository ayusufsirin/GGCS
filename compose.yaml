name: ggcs

x-registry-build-args: &registry-build-args
  DOCKER_REGISTRY: ${NEXUS_DOCKER_REGISTRY:-docker.io}
  NEXUS_NPM_REGISTRY: ${NEXUS_NPM_REGISTRY:-}
  NEXUS_PYPI_INDEX_URL: ${NEXUS_PYPI_INDEX_URL:-}
  NEXUS_APT_DEBIAN_URL: ${NEXUS_APT_DEBIAN_URL:-}
  NEXUS_APT_DEBIAN_SECURITY_URL: ${NEXUS_APT_DEBIAN_SECURITY_URL:-}
  NEXUS_APT_UBUNTU_URL: ${NEXUS_APT_UBUNTU_URL:-}
  NEXUS_APT_UBUNTU_SECURITY_URL: ${NEXUS_APT_UBUNTU_SECURITY_URL:-}
  NEXUS_APT_UBUNTU_PORTS_URL: ${NEXUS_APT_UBUNTU_PORTS_URL:-}
  NEXUS_APT_ROS2_URL: ${NEXUS_APT_ROS2_URL:-}

services:
  m01-verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m01-verify
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    command: ["pnpm", "run", "verify:m01"]

  m01-example:
    profiles: ["example"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m01-example
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    command: ["pnpm", "run", "example:m01"]

  web-dev:
    profiles: ["web"]
    build:
      context: .
      dockerfile: react.Dockerfile
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
    environment:
      HOST: 0.0.0.0
      WATCHPACK_POLLING: "true"
      REACT_APP_GGCS_ROSBRIDGE_URL: ${REACT_APP_GGCS_ROSBRIDGE_URL:-ws://localhost:9090}
    ports:
      - "${GGCS_WEB_DEV_PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./tsconfig.json:/app/tsconfig.json:ro

  web-prod:
    profiles: ["web-prod"]
    build:
      context: .
      dockerfile: react.prod.Dockerfile
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        REACT_APP_GGCS_ROSBRIDGE_URL: ${REACT_APP_GGCS_ROSBRIDGE_URL:-ws://localhost:9090}
    ports:
      - "${GGCS_WEB_PROD_PORT:-8080}:80"
    restart: unless-stopped

  rosbridge:
    profiles: ["ros"]
    build:
      context: .
      dockerfile: rosbridge.Dockerfile
      args:
        <<: *registry-build-args
    environment:
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    ports:
      - "${GGCS_ROSBRIDGE_PORT:-9090}:9090"
    restart: unless-stopped


  # Dedicated M02 ROSBridge fixture. Keep deterministic DDS settings isolated
  # from the generic rosbridge service so normal Web/ROS deployments remain
  # free to choose their own RMW/network policy.
  m02-rosbridge:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: rosbridge.Dockerfile
      args:
        <<: *registry-build-args
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
      CYCLONEDDS_URI: >-
        <CycloneDDS><Domain><General><Interfaces><NetworkInterface name="eth0" multicast="true"/></Interfaces><AllowMulticast>true</AllowMulticast></General></Domain></CycloneDDS>
    restart: unless-stopped

  m02-verify:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m02-verify
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    command: ["pnpm", "run", "verify:m02"]

  m03-verify:
    profiles: ["m03"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m03-verify
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    command: ["pnpm", "run", "verify:m03"]

  m02-connection-smoke:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m02-example
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_ROSBRIDGE_URL: ws://m02-rosbridge:9090
      GGCS_ROSBRIDGE_CONNECT_TIMEOUT_MS: ${GGCS_ROSBRIDGE_CONNECT_TIMEOUT_MS:-10000}
    depends_on:
      m02-rosbridge:
        condition: service_started
    command: ["pnpm", "run", "example:m02"]

  m02-ros-fixture:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: rosfixture.Dockerfile
      args:
        <<: *registry-build-args
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
      CYCLONEDDS_URI: >-
        <CycloneDDS><Domain><General><Interfaces><NetworkInterface name="eth0" multicast="true"/></Interfaces><AllowMulticast>true</AllowMulticast></General></Domain></CycloneDDS>
    depends_on:
      m02-rosbridge:
        condition: service_started
    restart: unless-stopped

  m02-topic-source-smoke:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m02-example
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_ROSBRIDGE_URL: ws://m02-rosbridge:9090
      GGCS_ROSBRIDGE_TOPIC_TIMEOUT_MS: ${GGCS_ROSBRIDGE_TOPIC_TIMEOUT_MS:-15000}
    depends_on:
      m02-rosbridge:
        condition: service_started
      m02-ros-fixture:
        condition: service_started
    command: ["pnpm", "run", "example:m02:topic"]

  m02-topic-command-smoke:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m02-example
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_ROSBRIDGE_URL: ws://m02-rosbridge:9090
      GGCS_ROSBRIDGE_COMMAND_TIMEOUT_MS: ${GGCS_ROSBRIDGE_COMMAND_TIMEOUT_MS:-15000}
    depends_on:
      m02-rosbridge:
        condition: service_started
      m02-ros-fixture:
        condition: service_started
    command: ["pnpm", "run", "example:m02:command"]

  m02-service-procedure-smoke:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m02-example
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_ROSBRIDGE_URL: ws://m02-rosbridge:9090
      GGCS_ROSBRIDGE_SERVICE_SMOKE_TIMEOUT_MS: ${GGCS_ROSBRIDGE_SERVICE_SMOKE_TIMEOUT_MS:-15000}
    depends_on:
      m02-rosbridge:
        condition: service_started
      m02-ros-fixture:
        condition: service_started
    command: ["pnpm", "run", "example:m02:service"]

  m02-parameter-provider-smoke:
    profiles: ["m02"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m02-example
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_ROSBRIDGE_URL: ws://m02-rosbridge:9090
      GGCS_ROSBRIDGE_PARAMETER_SMOKE_TIMEOUT_MS: ${GGCS_ROSBRIDGE_PARAMETER_SMOKE_TIMEOUT_MS:-15000}
    depends_on:
      m02-rosbridge:
        condition: service_started
      m02-ros-fixture:
        condition: service_started
    command: ["pnpm", "run", "example:m02:parameter"]

  # M03 live-shadow proof world. This remains isolated from M02 fixtures and
  # from the production Web application; all traffic is observational/read-only.
  m03-live-rosbridge:
    profiles: ["m03-live"]
    build:
      context: .
      dockerfile: rosbridge.Dockerfile
      args:
        <<: *registry-build-args
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
      CYCLONEDDS_URI: >-
        <CycloneDDS><Domain><General><Interfaces><NetworkInterface name="eth0" multicast="true"/></Interfaces><AllowMulticast>true</AllowMulticast></General></Domain></CycloneDDS>
    restart: unless-stopped

  m03-live-fixture:
    profiles: ["m03-live"]
    build:
      context: .
      dockerfile: m03fixture.Dockerfile
      args:
        <<: *registry-build-args
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
      CYCLONEDDS_URI: >-
        <CycloneDDS><Domain><General><Interfaces><NetworkInterface name="eth0" multicast="true"/></Interfaces><AllowMulticast>true</AllowMulticast></General></Domain></CycloneDDS>
    depends_on:
      m03-live-rosbridge:
        condition: service_started
    restart: unless-stopped

  m03-link-proxy:
    profiles: ["m03-live"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m03-live-proof
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_M03_PROXY_DATA_PORT: "9091"
      GGCS_M03_PROXY_CONTROL_PORT: "9092"
      GGCS_M03_PROXY_UPSTREAM_HOST: m03-live-rosbridge
      GGCS_M03_PROXY_UPSTREAM_PORT: "9090"
    depends_on:
      m03-live-rosbridge:
        condition: service_started
    command: ["pnpm", "run", "example:m03:proxy"]

  m03-live-shadow-proof:
    profiles: ["m03-live"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m03-live-proof
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    environment:
      GGCS_M03_SHADOW_URL: ws://m03-link-proxy:9091
      GGCS_M03_PROXY_CONTROL_HOST: m03-link-proxy
      GGCS_M03_PROXY_CONTROL_PORT: "9092"
      GGCS_M03_LIVE_TIMEOUT_MS: ${GGCS_M03_LIVE_TIMEOUT_MS:-30000}
    depends_on:
      m03-live-rosbridge:
        condition: service_started
      m03-live-fixture:
        condition: service_started
      m03-link-proxy:
        condition: service_started
    command: ["pnpm", "run", "example:m03:live"]

  # M03 Slice 04 production/on-target closure proof. This service connects to
  # an already running real Sensor Suite rosbridge endpoint; it never starts a
  # synthetic ArNav interface or production control fixture.
  m03-on-target-proof:
    profiles: ["m03-on-target"]
    build:
      context: .
      dockerfile: Dockerfile
      target: m03-on-target-proof
      args:
        <<: *registry-build-args
        NODE_VERSION: ${GGCS_NODE_VERSION:-22.23.2}
        PNPM_VERSION: ${GGCS_PNPM_VERSION:-10.34.5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GGCS_ROSBRIDGE_URL: ${GGCS_M03_ON_TARGET_ROSBRIDGE_URL:-ws://host.docker.internal:9090}
      GGCS_M03_ON_TARGET_STARTUP_TIMEOUT_MS: ${GGCS_M03_ON_TARGET_STARTUP_TIMEOUT_MS:-30000}
      GGCS_M03_ON_TARGET_TIMEOUT_MS: ${GGCS_M03_ON_TARGET_TIMEOUT_MS:-1800000}
      GGCS_M03_ON_TARGET_MIN_DURATION_MS: ${GGCS_M03_ON_TARGET_MIN_DURATION_MS:-600000}
      GGCS_M03_ON_TARGET_MIN_HIGH_RATE_MATCHES: ${GGCS_M03_ON_TARGET_MIN_HIGH_RATE_MATCHES:-1000}
      GGCS_M03_ON_TARGET_MIN_LOW_RATE_MATCHES: ${GGCS_M03_ON_TARGET_MIN_LOW_RATE_MATCHES:-20}
      GGCS_M03_ON_TARGET_MAX_SKEW_MS: ${GGCS_M03_ON_TARGET_MAX_SKEW_MS:-100}
      GGCS_M03_ON_TARGET_PARAMETER_TIMEOUT_MS: ${GGCS_M03_ON_TARGET_PARAMETER_TIMEOUT_MS:-15000}
      GGCS_M03_ON_TARGET_PARAMETER_IDS: ${GGCS_M03_ON_TARGET_PARAMETER_IDS:-}
      GGCS_M03_ON_TARGET_PARAMETER_DISPOSITION: ${GGCS_M03_ON_TARGET_PARAMETER_DISPOSITION:-}
      GGCS_M03_ON_TARGET_CAMERA_MODE: ${GGCS_M03_ON_TARGET_CAMERA_MODE:-off}
      GGCS_M03_ON_TARGET_CAMERA_DISPOSITION: ${GGCS_M03_ON_TARGET_CAMERA_DISPOSITION:-}
      GGCS_M03_ON_TARGET_CAMERA_MIN_SAMPLES: ${GGCS_M03_ON_TARGET_CAMERA_MIN_SAMPLES:-20}
      GGCS_M03_ON_TARGET_LEGACY_UI_OBSERVATION: ${GGCS_M03_ON_TARGET_LEGACY_UI_OBSERVATION:-}
    command: ["pnpm", "run", "example:m03:on-target"]
